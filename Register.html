
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BloodConnect - Register</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    color:#333;
    background:
        radial-gradient(circle at 15% 10%, rgba(99,102,241,.09) 0%, transparent 40%),
        radial-gradient(circle at 85% 25%, rgba(20,184,166,.08) 0%, transparent 45%),
        radial-gradient(circle at 30% 90%, rgba(236,72,153,.06) 0%, transparent 50%),
        radial-gradient(circle at 90% 85%, rgba(251,191,36,.07) 0%, transparent 45%),
        linear-gradient(135deg, #f7f8fc 0%, #f2f4fa 50%, #eef1f8 100%);
    background-attachment: fixed;
}

/* Header */

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
    background:white;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

header h2{
    color:#d62828;
}

nav a{
    text-decoration:none;
    color:#333;
    margin:0 12px;
    font-weight:500;
}

nav a:hover{
    color:#d62828;
}



.container{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:50px 20px;
}

.register-box{
    width:700px;
    background:white;
    padding:40px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.register-box h1{
    color:#d62828;
    text-align:center;
    margin-bottom:10px;
}

.register-box p{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    outline:none;
    font-size:15px;
}

input:focus,
select:focus{
    border:2px solid #d62828;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

button{
    width:100%;
    padding:14px;
    background:#d62828;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:17px;
    transition:.3s;
}

button:hover{
    background:#b71c1c;
}

#message{
    margin-top:20px;
    text-align:center;
    font-weight:bold;
}

.extra{
    text-align:center;
    margin-top:20px;
}

.extra a{
    color:#d62828;
    text-decoration:none;
    font-weight:bold;
}

.extra a:hover{
    text-decoration:underline;
}

footer{
    margin-top:40px;
    background:#d62828;
    color:white;
    text-align:center;
    padding:25px;
}

@media(max-width:700px){

    header{
        flex-direction:column;
        gap:15px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .register-box{
        width:100%;
    }

}

</style>

</head>

<body>

<header>

<div>
<h2>BloodConnect</h2>
<p>Save a Life</p>
</div>

<nav>
<a href="index.html">Home</a>
<a href="Login.html">Login</a>
</nav>

</header>

<div class="container">

<div class="register-box">

<h1>Create Account</h1>

<p>Join BloodConnect and help save lives.</p>

<form id="registerForm">

<div class="grid">

<div class="form-group">
<label>Full Name</label>
<input type="text" id="name" required>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" id="email" required>
</div>

<div class="form-group">
<label>Phone Number</label>
<input type="tel" id="phone" required>
</div>

<div class="form-group">
<label>Blood Group</label>

<select id="bloodGroup" required>

<option value="">Select</option>

<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>

</select>

</div>

<div class="form-group">
<label>Gender</label>

<select id="gender" required>

<option value="">Select</option>

<option>Male</option>
<option>Female</option>
<option>Other</option>

</select>

</div>

<div class="form-group">
<label>Date of Birth</label>
<input type="date" id="dob" required>
</div>

<div class="form-group">
<label>Division</label>
<input type="text" id="division" required>
</div>

<div class="form-group">
<label>District</label>
<input type="text" id="district" required>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" id="password" required>
</div>

<div class="form-group">
<label>Confirm Password</label>
<input type="password" id="confirmPassword" required>
</div>

<div class="form-group">
<label>Last Blood Donation Date</label>
<input type="date" id="lastDonation">
</div>

</div>

<button type="submit">
Register
</button>

</form>

<p id="message"></p>

<div class="extra">

Already have an account?

<a href="Login.html">
Login
</a>

</div>

</div>

</div>

<footer>

<p>
© 2026 BloodConnect. All Rights Reserved.
</p>

</footer>

<script>
document.getElementById("registerForm").addEventListener("submit", function (e) {

    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const phone = document.getElementById("phone").value.trim();
    const bloodGroup = document.getElementById("bloodGroup").value;
    const gender = document.getElementById("gender").value;
    const dob = document.getElementById("dob").value;
    const division = document.getElementById("division").value.trim();
    const district = document.getElementById("district").value.trim();
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirmPassword").value;
    const lastDonation = document.getElementById("lastDonation").value;

    const message = document.getElementById("message");

    if (password.length < 6) {
        message.style.color = "red";
        message.innerHTML = "Password must be at least 6 characters.";
        return;
    }

    if (password !== confirm) {
        message.style.color = "red";
        message.innerHTML = "Passwords do not match.";
        return;
    }

const users = JSON.parse(localStorage.getItem("users")) || [];
const me = JSON.parse(localStorage.getItem("currentUser"));
if (me && !users.find(u => u.email === me.email)) {
    users.push(me);
    localStorage.setItem("users", JSON.stringify(users));
}
    // Prevent duplicate accounts
    const existing = users.find(u => u.email === email);

    if (existing) {
        message.style.color = "red";
        message.innerHTML = "An account with this email already exists.";
        return;
    }

    const newUser = {
        name: name,
        email: email,
        phone: phone,
        bloodGroup: bloodGroup,
        gender: gender,
        dob: dob,
        location: [division, district].filter(Boolean).join(", "),
        division: division,
        district: district,
        password: password, // NOTE: plain text, fine for a local demo only
        lastDonation: lastDonation,
        photo: "images/user.png",
        coverImage: "",
        memberSince: new Date().toLocaleString("en-US", { month: "long", year: "numeric" }),
        reliability: "98%",
        totalDonations: "0",
        livesSaved: "0"
    };

    users.push(newUser);

    localStorage.setItem("users", JSON.stringify(users));

    message.style.color = "green";
    message.innerHTML = "Registration Successful! Redirecting to Login...";

    setTimeout(function () {
        window.location.href = "login.html";
    }, 1800);

});

const inputs = document.querySelectorAll("input,select");

inputs.forEach(function (input) {

    input.addEventListener("focus", function () {
        this.style.background = "#fff7f7";
    });

    input.addEventListener("blur", function () {
        this.style.background = "white";
    });

});


</script>

</body>
</html>
```
